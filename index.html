<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>インターバルタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --activity-bg: #fff8f0;
    --activity-ring: #f59e0b;
    --activity-ring-bg: #fef3c7;
    --activity-text: #b45309;
    --activity-btn: #f59e0b;
    --activity-btn-hover: #d97706;
    --rest-bg: #f0fdf8;
    --rest-ring: #10b981;
    --rest-ring-bg: #d1fae5;
    --rest-text: #065f46;
    --rest-btn: #10b981;
    --rest-btn-hover: #059669;
    --complete-bg: #fffbeb;
    --complete-ring: #f59e0b;
    --complete-text: #d97706;
    --complete-btn: #f59e0b;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --card-bg: rgba(255,255,255,0.88);
    --shadow: 0 20px 60px rgba(0,0,0,0.1);
  }

  body {
    font-family: 'BIZ UDGothic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    transition: background 0.7s;
    background: var(--current-bg, #fff8f0);
  }

  body.phase-activity { --current-bg: linear-gradient(160deg, #fff8f0 0%, #fef3c7 100%); }
  body.phase-rest     { --current-bg: linear-gradient(160deg, #f0fdf8 0%, #d1fae5 100%); }
  body.phase-complete { --current-bg: linear-gradient(160deg, #fffbeb 0%, #fef9c3 100%); }
  body { background: var(--current-bg); }

  /* Top buttons */
  .top-btn {
    position: fixed;
    top: 1.25rem;
    padding: 0.75rem;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(8px);
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s, transform 0.3s;
    z-index: 20;
    color: var(--gray-500);
  }
  .top-btn:hover { opacity: 1; }
  #btn-settings { left: 1.25rem; }
  #btn-settings:hover { transform: rotate(45deg); }
  #btn-sound { right: 1.25rem; }
  .top-btn svg { width: 28px; height: 28px; display: block; }

  /* Card */
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border-radius: 28px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 2rem 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.5s;
  }

  /* Phase header */
  .phase-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .phase-icon { font-size: 2.5rem; line-height: 1; }
  .phase-label {
    font-size: 1.4rem;
    font-weight: 700;
    transition: color 0.5s;
  }
  .phase-activity .phase-label { color: var(--activity-text); }
  .phase-rest .phase-label     { color: var(--rest-text); }

  /* Cycle counter */
  .cycle-counter {
    background: var(--gray-100);
    padding: 0.35rem 1.25rem;
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--gray-600);
    font-weight: 700;
    margin-bottom: 1.5rem;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
  }
  .cycle-counter .count { font-size: 1.1rem; color: var(--gray-800); }
  .cycle-counter .sep   { color: var(--gray-400); margin: 0 4px; }
  .cycle-counter .total { color: var(--gray-500); }

  /* Ring */
  .ring-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0.5rem 0 1.5rem;
  }
  .ring-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  #ring-bg   { transition: stroke 0.5s; }
  #ring-prog { transition: stroke 0.5s, stroke-dashoffset 0.3s linear; }
  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .time-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 6rem;
    line-height: 1;
    color: var(--gray-800);
    letter-spacing: 2px;
  }
  .time-unit {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--gray-400);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 1rem;
    width: 100%;
    max-width: 320px;
  }
  .btn {
    flex: 1;
    padding: 1rem 1.25rem;
    border-radius: 16px;
    border: none;
    font-family: 'BIZ UDGothic', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: transform 0.15s, background 0.2s;
    letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.95); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .btn-reset {
    background: var(--gray-200);
    color: var(--gray-700);
  }
  .btn-reset:hover { background: #cbd5e1; }

  .btn-primary {
    color: #fff;
  }
  .phase-activity .btn-primary { background: var(--activity-btn); }
  .phase-activity .btn-primary:hover { background: var(--activity-btn-hover); }
  .phase-rest .btn-primary     { background: var(--rest-btn); }
  .phase-rest .btn-primary:hover { background: var(--rest-btn-hover); }

  /* Complete screen */
  #screen-complete { display: none; flex-direction: column; align-items: center; padding: 1.5rem 0; }
  #screen-complete.visible { display: flex; animation: scaleUp 0.3s cubic-bezier(0.16,1,0.3,1); }
  .trophy { font-size: 5.5rem; line-height: 1; margin-bottom: 1rem; animation: bounce 2.5s infinite; }
  .complete-title {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--complete-text);
    margin-bottom: 0.5rem;
  }
  .complete-msg {
    color: var(--gray-600);
    font-size: 1rem;
    text-align: center;
    max-width: 280px;
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }
  .complete-box {
    background: #fffbeb;
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 16px;
    padding: 1rem 2rem;
    text-align: center;
    margin-bottom: 1.75rem;
    width: 100%;
    max-width: 260px;
  }
  .complete-box .clabel { font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; color: #92400e; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .complete-box .cval   { font-size: 1.8rem; font-weight: 700; color: var(--gray-800); }
  .btn-again {
    width: 100%;
    max-width: 260px;
    padding: 1rem;
    border-radius: 16px;
    border: none;
    background: var(--complete-btn);
    color: #fff;
    font-family: 'BIZ UDGothic', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    letter-spacing: 1px;
  }
  .btn-again:hover { background: var(--activity-btn-hover); }
  .btn-again:active { transform: scale(0.95); }

  /* Settings modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .overlay.open { display: flex; animation: fadeIn 0.2s; }
  .modal {
    background: #fff;
    border-radius: 28px;
    padding: 1.75rem;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.2);
    animation: scaleUp 0.25s cubic-bezier(0.16,1,0.3,1);
  }
  .modal-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gray-800);
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-close {
    position: absolute;
    top: 1.1rem;
    right: 1.1rem;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--gray-400);
    padding: 0.4rem;
    border-radius: 50%;
    transition: color 0.2s;
  }
  .btn-close:hover { color: var(--gray-700); }
  .btn-close svg { width: 22px; height: 22px; display: block; }

  .setting-group { margin-bottom: 1.5rem; }
  .setting-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--gray-600);
    margin-bottom: 0.6rem;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    border: 1px solid var(--gray-200);
    border-radius: 16px;
    padding: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .btn-step {
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 0.6rem 0.9rem;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gray-600);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: 'BIZ UDGothic', sans-serif;
  }
  .btn-step:hover { background: var(--gray-200); }
  .btn-step:active { transform: scale(0.93); }
  .step-val { text-align: center; min-width: 60px; }
  .step-num { font-size: 1.8rem; font-weight: 700; }
  .step-unit { font-size: 0.75rem; color: var(--gray-400); }

  .preset-row { display: flex; gap: 6px; }
  .btn-preset {
    flex: 1;
    padding: 5px 0;
    font-size: 0.75rem;
    font-weight: 700;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'BIZ UDGothic', sans-serif;
    background: var(--gray-100);
    color: var(--gray-600);
    transition: background 0.15s;
  }
  .btn-preset:hover { background: var(--gray-200); }
  .btn-preset.active-amber { background: #f59e0b; color: #fff; }
  .btn-preset.active-emerald { background: #10b981; color: #fff; }
  .btn-preset.active-blue { background: #3b82f6; color: #fff; }

  .step-num.amber  { color: #f59e0b; }
  .step-num.emerald{ color: #10b981; }
  .step-num.blue   { color: #3b82f6; }

  /* Toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0;
    border-top: 1px solid var(--gray-200);
    margin-top: 1.25rem;
  }
  .toggle-label { font-size: 0.85rem; font-weight: 700; color: var(--gray-600); display: flex; align-items: center; gap: 0.4rem; }
  .toggle { position: relative; width: 52px; height: 30px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #cbd5e1;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-slider::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    left: 4px; top: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .toggle input:checked ~ .toggle-slider { background: #f59e0b; }
  .toggle input:checked ~ .toggle-slider::after { transform: translateX(22px); }

  .btn-apply {
    width: 100%;
    margin-top: 1.75rem;
    padding: 1rem;
    border-radius: 16px;
    border: none;
    font-family: 'BIZ UDGothic', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: background 0.2s, transform 0.15s;
    letter-spacing: 1px;
  }
  .btn-apply:active { transform: scale(0.97); }
  .phase-activity .btn-apply, .btn-apply { background: var(--activity-btn); }

  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleUp { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bounce  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  @media (max-width: 400px) {
    .time-num { font-size: 4.5rem; }
    .ring-wrap { width: 240px; height: 240px; }
    .card { padding: 1.5rem 1.25rem 2rem; }
  }
</style>
</head>
<body class="phase-activity">

<!-- 設定ボタン -->
<button class="top-btn" id="btn-settings" aria-label="設定を開く">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<!-- 音量ボタン -->
<button class="top-btn" id="btn-sound" aria-label="音声切り替え">
  <svg id="icon-volume-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
  </svg>
  <svg id="icon-volume-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
</button>

<!-- メインカード -->
<div class="card" id="main-card">

  <!-- 通常画面 -->
  <div id="screen-main">
    <div class="phase-header">
      <span class="phase-icon" id="phase-icon">🔥</span>
      <span class="phase-label" id="phase-label">活動（アクティビティ）</span>
    </div>

    <div class="cycle-counter">
      セット数: <span class="count" id="disp-cycles">0</span>
      <span class="sep">/</span>
      <span class="total" id="disp-target">3</span>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 320 320">
        <circle id="ring-bg"   cx="160" cy="160" r="148" fill="transparent" stroke="#fef3c7" stroke-width="14"/>
        <circle id="ring-prog" cx="160" cy="160" r="148" fill="transparent" stroke="#f59e0b" stroke-width="14"
          stroke-dasharray="929.91" stroke-dashoffset="0" stroke-linecap="round"/>
      </svg>
      <div class="time-display">
        <span class="time-num" id="disp-time">30</span>
        <span class="time-unit">秒</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-reset" id="btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
        </svg>
        リセット
      </button>
      <button class="btn btn-primary" id="btn-toggle">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span id="toggle-label">スタート</span>
      </button>
    </div>
  </div>

  <!-- 完了画面 -->
  <div id="screen-complete">
    <div class="trophy">🏆</div>
    <div class="complete-title">全セット完了！</div>
    <div class="complete-msg">お疲れ様でした！すべてのプログラムが終了しました。ゆっくり休んでくださいね。</div>
    <div class="complete-box">
      <span class="clabel">達成セット数</span>
      <span class="cval"><span id="disp-complete-cycles">3</span> / <span id="disp-complete-target">3</span> セット</span>
    </div>
    <button class="btn-again" id="btn-again">もう一度行う</button>
  </div>

</div>

<!-- 設定モーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="btn-close" id="btn-close-modal" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      タイマー設定
    </div>

    <!-- 活動時間 -->
    <div class="setting-group">
      <label class="setting-label">🔥 活動（アクティビティ）時間</label>
      <div class="setting-row">
        <button class="btn-step" id="act-minus">-5s</button>
        <div class="step-val">
          <div class="step-num amber" id="disp-act">30</div>
          <div class="step-unit">秒</div>
        </div>
        <button class="btn-step" id="act-plus">+5s</button>
      </div>
      <div class="preset-row" id="presets-act"></div>
    </div>

    <!-- 休憩時間 -->
    <div class="setting-group">
      <label class="setting-label">☕ 休憩（レスト）時間</label>
      <div class="setting-row">
        <button class="btn-step" id="rest-minus">-5s</button>
        <div class="step-val">
          <div class="step-num emerald" id="disp-rest">30</div>
          <div class="step-unit">秒</div>
        </div>
        <button class="btn-step" id="rest-plus">+5s</button>
      </div>
      <div class="preset-row" id="presets-rest"></div>
    </div>

    <!-- セット数 -->
    <div class="setting-group">
      <label class="setting-label">🔁 目標セット数</label>
      <div class="setting-row">
        <button class="btn-step" id="cyc-minus">－</button>
        <div class="step-val">
          <div class="step-num blue" id="disp-cyc">3</div>
          <div class="step-unit" id="disp-cyc-unit">セット</div>
        </div>
        <button class="btn-step" id="cyc-plus">＋</button>
      </div>
      <div class="preset-row" id="presets-cyc"></div>
    </div>

    <!-- サウンドトグル -->
    <div class="toggle-row">
      <span class="toggle-label">🔔 残り3秒のカウントダウン音</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-sound" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <button class="btn-apply" id="btn-apply">設定を適用して戻る</button>
  </div>
</div>

<script>
// ======== 状態 ========
const CIRCUMFERENCE = 929.91; // 2 * π * 148

let state = {
  activityDuration: 30,
  restDuration: 30,
  targetCycles: 3,
  currentPhase: 'activity',
  timeLeft: 30,
  isActive: false,
  isStarted: false,
  completedCycles: 0,
  isCompleted: false,
  soundEnabled: true,
};

let timerInterval = null;
let audioCtx = null;

// ======== DOM ========
const body            = document.body;
const mainCard        = document.getElementById('main-card');
const screenMain      = document.getElementById('screen-main');
const screenComplete  = document.getElementById('screen-complete');
const phaseIcon       = document.getElementById('phase-icon');
const phaseLabel      = document.getElementById('phase-label');
const dispCycles      = document.getElementById('disp-cycles');
const dispTarget      = document.getElementById('disp-target');
const dispTime        = document.getElementById('disp-time');
const ringBg          = document.getElementById('ring-bg');
const ringProg        = document.getElementById('ring-prog');
const btnToggle       = document.getElementById('btn-toggle');
const iconPlay        = document.getElementById('icon-play');
const iconPause       = document.getElementById('icon-pause');
const toggleLabel     = document.getElementById('toggle-label');
const btnReset        = document.getElementById('btn-reset');
const btnSettings     = document.getElementById('btn-settings');
const btnSound        = document.getElementById('btn-sound');
const iconVolumeOn    = document.getElementById('icon-volume-on');
const iconVolumeOff   = document.getElementById('icon-volume-off');
const overlay         = document.getElementById('overlay');
const btnCloseModal   = document.getElementById('btn-close-modal');
const btnApply        = document.getElementById('btn-apply');
const btnAgain        = document.getElementById('btn-again');
const dispAct         = document.getElementById('disp-act');
const dispRest        = document.getElementById('disp-rest');
const dispCyc         = document.getElementById('disp-cyc');
const dispCycUnit     = document.getElementById('disp-cyc-unit');
const toggleSound     = document.getElementById('toggle-sound');
const dispCompCycles  = document.getElementById('disp-complete-cycles');
const dispCompTarget  = document.getElementById('disp-complete-target');
const btnApplyEl      = document.getElementById('btn-apply');

// ======== プリセット生成 ========
function makePresets(containerId, values, getVal, setVal, activeClass, labelFn) {
  const cont = document.getElementById(containerId);
  values.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'btn-preset';
    btn.dataset.val = v === null ? 'null' : String(v);
    btn.textContent = labelFn(v);
    btn.addEventListener('click', () => { setVal(v); renderSettings(); });
    cont.appendChild(btn);
  });
}

makePresets('presets-act', [15,30,45,60,90],
  () => state.activityDuration,
  v => { state.activityDuration = v; },
  'active-amber',
  v => v + '秒'
);
makePresets('presets-rest', [10,15,30,45,60],
  () => state.restDuration,
  v => { state.restDuration = v; },
  'active-emerald',
  v => v + '秒'
);
makePresets('presets-cyc', [null,3,5,10],
  () => state.targetCycles,
  v => { state.targetCycles = v; },
  'active-blue',
  v => v === null ? 'なし' : v + '回'
);

// ======== Audio ========
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playBeep(type) {
  if (!state.soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (type === 'complete') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
        gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.6);
        osc.start(ctx.currentTime + i * 0.12);
        osc.stop(ctx.currentTime + i * 0.12 + 0.6);
      });
      return;
    }
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'countdown') {
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } else if (type === 'switch') {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.start(); osc.stop(ctx.currentTime + 0.8);
    }
  } catch(e) { console.warn('audio error', e); }
}

// ======== タイマー ========
function startInterval() {
  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

function tick() {
  if (!state.isActive || state.isCompleted) return;
  state.timeLeft--;

  if (state.timeLeft <= 0) {
    if (state.currentPhase === 'activity') {
      // アクティビティ終了 → セット数増加
      state.completedCycles++;
      if (state.targetCycles !== null && state.completedCycles >= state.targetCycles) {
        // 目標到達 → 完了
        state.isActive = false;
        state.isCompleted = true;
        clearInterval(timerInterval);
        playBeep('complete');
        state.timeLeft = state.activityDuration;
        render();
        return;
      }
      // 休憩へ
      playBeep('switch');
      state.currentPhase = 'rest';
      state.timeLeft = state.restDuration;
    } else {
      // 休憩終了 → アクティビティへ（セット数変えない）
      playBeep('switch');
      state.currentPhase = 'activity';
      state.timeLeft = state.activityDuration;
    }
  } else if (state.timeLeft <= 3) {
    playBeep('countdown');
  }

  render();
}

// ======== 描画 ========
function render() {
  // フェーズクラス
  body.className = state.isCompleted ? 'phase-complete' : (state.currentPhase === 'activity' ? 'phase-activity' : 'phase-rest');

  if (state.isCompleted) {
    screenMain.style.display = 'none';
    screenComplete.classList.add('visible');
    dispCompCycles.textContent = state.completedCycles;
    dispCompTarget.textContent = state.targetCycles;
    return;
  }

  screenMain.style.display = '';
  screenComplete.classList.remove('visible');

  // フェーズ表示
  const isAct = state.currentPhase === 'activity';
  phaseIcon.textContent  = isAct ? '🔥' : '☕';
  phaseLabel.textContent = isAct ? '活動（アクティビティ）' : '休憩（レスト）';

  // セットカウンター
  dispCycles.textContent = state.completedCycles;
  dispTarget.textContent = state.targetCycles === null ? '∞' : state.targetCycles;

  // 残り時間
  dispTime.textContent = state.timeLeft;

  // リング
  const total = isAct ? state.activityDuration : state.restDuration;
  const pct   = state.timeLeft / total; // 1.0 → 0.0
  const offset = CIRCUMFERENCE * (1 - pct); // 0 → 満タン、増えると減る
  ringProg.setAttribute('stroke-dashoffset', offset);
  ringProg.setAttribute('stroke', isAct ? '#f59e0b' : '#10b981');
  ringBg.setAttribute('stroke', isAct ? '#fef3c7' : '#d1fae5');

  // ボタン
  if (state.isActive) {
    iconPlay.style.display  = 'none';
    iconPause.style.display = '';
    toggleLabel.textContent = '一時停止';
  } else {
    iconPlay.style.display  = '';
    iconPause.style.display = 'none';
    toggleLabel.textContent = 'スタート';
  }
}

function renderSettings() {
  dispAct.textContent = state.activityDuration;
  dispRest.textContent = state.restDuration;
  dispCyc.textContent = state.targetCycles === null ? 'なし' : state.targetCycles;
  dispCycUnit.textContent = state.targetCycles === null ? 'ずっと繰り返す' : 'セット';

  // プリセットのアクティブ状態
  document.querySelectorAll('#presets-act .btn-preset').forEach(btn => {
    btn.className = 'btn-preset' + (parseInt(btn.dataset.val) === state.activityDuration ? ' active-amber' : '');
  });
  document.querySelectorAll('#presets-rest .btn-preset').forEach(btn => {
    btn.className = 'btn-preset' + (parseInt(btn.dataset.val) === state.restDuration ? ' active-emerald' : '');
  });
  document.querySelectorAll('#presets-cyc .btn-preset').forEach(btn => {
    const v = btn.dataset.val === 'null' ? null : parseInt(btn.dataset.val);
    btn.className = 'btn-preset' + (v === state.targetCycles ? ' active-blue' : '');
  });

  toggleSound.checked = state.soundEnabled;
}

// ======== イベント ========
btnToggle.addEventListener('click', () => {
  getAudioCtx(); // iOS unlock
  state.isActive = !state.isActive;
  state.isStarted = true;
  if (state.isActive) startInterval();
  else clearInterval(timerInterval);
  render();
});

btnReset.addEventListener('click', () => {
  clearInterval(timerInterval);
  state.isActive = false;
  state.isStarted = false;
  state.currentPhase = 'activity';
  state.timeLeft = state.activityDuration;
  state.completedCycles = 0;
  state.isCompleted = false;
  render();
});

btnAgain.addEventListener('click', () => {
  clearInterval(timerInterval);
  state.isActive = false;
  state.isStarted = false;
  state.currentPhase = 'activity';
  state.timeLeft = state.activityDuration;
  state.completedCycles = 0;
  state.isCompleted = false;
  render();
});

btnSettings.addEventListener('click', () => {
  renderSettings();
  overlay.classList.add('open');
});
btnCloseModal.addEventListener('click', () => overlay.classList.remove('open'));
btnApply.addEventListener('click', () => {
  state.soundEnabled = toggleSound.checked;
  if (!state.isStarted) {
    state.timeLeft = state.currentPhase === 'activity' ? state.activityDuration : state.restDuration;
  }
  overlay.classList.remove('open');
  render();
});
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

btnSound.addEventListener('click', () => {
  state.soundEnabled = !state.soundEnabled;
  iconVolumeOn.style.display  = state.soundEnabled ? '' : 'none';
  iconVolumeOff.style.display = state.soundEnabled ? 'none' : '';
  toggleSound.checked = state.soundEnabled;
});

// 活動時間ステップ
document.getElementById('act-minus').addEventListener('click', () => { state.activityDuration = Math.max(1, state.activityDuration - 5); renderSettings(); });
document.getElementById('act-plus').addEventListener('click',  () => { state.activityDuration += 5; renderSettings(); });
// 休憩時間ステップ
document.getElementById('rest-minus').addEventListener('click', () => { state.restDuration = Math.max(1, state.restDuration - 5); renderSettings(); });
document.getElementById('rest-plus').addEventListener('click',  () => { state.restDuration += 5; renderSettings(); });
// セット数ステップ
document.getElementById('cyc-minus').addEventListener('click', () => {
  if (state.targetCycles === null) state.targetCycles = 1;
  else if (state.targetCycles <= 1) state.targetCycles = null;
  else state.targetCycles--;
  renderSettings();
});
document.getElementById('cyc-plus').addEventListener('click', () => {
  if (state.targetCycles === null) state.targetCycles = 1;
  else state.targetCycles++;
  renderSettings();
});

// 初期描画
render();
</script>
</body>
</html>
